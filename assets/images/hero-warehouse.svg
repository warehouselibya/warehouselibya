<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#e06500"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="palletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lights -->
  <circle cx="200" cy="150" r="140" fill="#1e3a8a" opacity="0.4" filter="url(#glow)"/>
  <circle cx="600" cy="350" r="160" fill="#ff7a00" opacity="0.25" filter="url(#glow)"/>

  <!-- Warehouse Shelving Racks Background Grid -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="2">
    <!-- Vertical Pillars -->
    <line x1="80" y1="50" x2="80" y2="520" stroke-width="4"/>
    <line x1="280" y1="50" x2="280" y2="520" stroke-width="4"/>
    <line x1="480" y1="50" x2="480" y2="520" stroke-width="4"/>
    <line x1="680" y1="50" x2="680" y2="520" stroke-width="4"/>
    <!-- Horizontal Beams -->
    <line x1="60" y1="120" x2="720" y2="120" stroke-width="6"/>
    <line x1="60" y1="260" x2="720" y2="260" stroke-width="6"/>
    <line x1="60" y1="400" x2="720" y2="400" stroke-width="6"/>
    <line x1="40" y1="520" x2="760" y2="520" stroke-width="8" stroke="#cbd5e1"/>
  </g>

  <!-- Isometric Warehouse Forklift / Pallet Display -->
  <g transform="translate(100, 180)">
    <!-- Wooden Pallet 1 (Left) -->
    <g transform="translate(40, 220)">
      <rect x="0" y="30" width="180" height="15" rx="3" fill="url(#palletGrad)" />
      <rect x="20" y="45" width="25" height="15" fill="#451a03" />
      <rect x="80" y="45" width="25" height="15" fill="#451a03" />
      <rect x="140" y="45" width="25" height="15" fill="#451a03" />
      <!-- Cargo Boxes -->
      <rect x="15" y="-60" width="70" height="90" rx="6" fill="url(#boxGrad1)" />
      <line x1="15" y1="-15" x2="85" y2="-15" stroke="#b45309" stroke-width="3"/>
      <rect x="95" y="-40" width="70" height="70" rx="6" fill="url(#boxGrad2)" />
      <line x1="95" y1="-5" x2="165" y2="-5" stroke="#0369a1" stroke-width="3"/>
      <rect x="35" y="-130" width="60" height="65" rx="6" fill="#f8fafc" />
      <!-- Box Tape & Label -->
      <rect x="50" y="-120" width="30" height="15" rx="2" fill="#e2e8f0" />
      <path d="M45 -130 L45 -65" stroke="#cbd5e1" stroke-width="4"/>
    </g>

    <!-- Pallet 2 (Right / Stacked Higher) -->
    <g transform="translate(320, 180)">
      <rect x="0" y="70" width="220" height="18" rx="4" fill="url(#palletGrad)" />
      <rect x="25" y="88" width="30" height="18" fill="#451a03" />
      <rect x="100" y="88" width="30" height="18" fill="#451a03" />
      <rect x="175" y="88" width="30" height="18" fill="#451a03" />

      <!-- Layer 1 boxes -->
      <rect x="10" y="-10" width="90" height="80" rx="6" fill="url(#boxGrad3)" />
      <rect x="115" y="-10" width="95" height="80" rx="6" fill="url(#boxGrad1)" />
      
      <!-- Layer 2 boxes -->
      <rect x="25" y="-85" width="80" height="70" rx="6" fill="#3b82f6" />
      <rect x="120" y="-85" width="80" height="70" rx="6" fill="#f8fafc" />

      <!-- Layer 3 box -->
      <rect x="65" y="-155" width="85" height="65" rx="6" fill="url(#boxGrad2)" />
      <path d="M107 -155 L107 -90" stroke="#0284c7" stroke-width="4"/>
    </g>
  </g>

  <!-- Floating Wholesale Quality Badges -->
  <g transform="translate(520, 70)">
    <rect width="210" height="65" rx="14" fill="#1e293b" stroke="#ff7a00" stroke-width="2" filter="url(#glow)" opacity="0.95"/>
    <circle cx="35" cy="32" r="18" fill="#ff7a00" />
    <path d="M27 32 L33 38 L43 27" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="65" y="28" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">أسعار جملة الجملة</text>
    <text x="65" y="48" font-family="'Readex Pro', sans-serif" font-size="11" fill="#94a3b8">توفير مباشر لأصحاب المتاجر</text>
  </g>

  <g transform="translate(60, 90)">
    <rect width="200" height="65" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.95"/>
    <circle cx="35" cy="32" r="18" fill="#38bdf8" />
    <!-- Truck SVG Icon -->
    <path d="M26 36 L26 28 L38 28 L44 32 L44 36 Z" fill="#0f172a"/>
    <circle cx="30" cy="37" r="3" fill="#ffffff"/>
    <circle cx="40" cy="37" r="3" fill="#ffffff"/>
    <text x="65" y="28" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">شحن وتوريد سريع</text>
    <text x="65" y="48" font-family="'Readex Pro', sans-serif" font-size="11" fill="#94a3b8">تجهيز فوري للطلبيات</text>
  </g>
</svg>
