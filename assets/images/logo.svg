<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Icon / Emblem: Modern Warehouse & Boxes -->
  <g transform="translate(10, 10)">
    <rect x="0" y="10" width="70" height="65" rx="14" fill="url(#logoGrad)" />
    <!-- Warehouse roof outline -->
    <path d="M15 42 L35 24 L55 42" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Stacked Boxes -->
    <rect x="22" y="44" width="12" height="12" rx="2.5" fill="#f8fafc" />
    <rect x="36" y="44" width="12" height="12" rx="2.5" fill="url(#goldGrad)" />
    <rect x="29" y="30" width="12" height="12" rx="2.5" fill="#f8fafc" opacity="0.9"/>
    <!-- Pillar line -->
    <circle cx="35" cy="65" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Arabic & English Typography -->
  <text x="95" y="45" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="28" font-weight="900" fill="#0f172a">
    شركة المستودع
  </text>
  <text x="96" y="68" font-family="'Readex Pro', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#d97706" letter-spacing="3">
    WAREHOUSE <tspan fill="#64748b" font-weight="500" letter-spacing="0">| تجارة الجملة</tspan>
  </text>
</svg>
